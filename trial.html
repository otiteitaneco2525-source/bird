    shelf:`<path d="M21 7h60v86H21z" fill="${edge}"/><path d="M25 11h51v76H25z" fill="${paint}"/>${[30,54,78].map(y=>`<path d="M28 ${y-17}h7v16h-7zm10 1h6v15h-6zm9-2h10v17H47zm14 3h10v14H61z" fill="${c.light}" stroke="${edge}"/><path d="M24 ${y}h53v4H24z" fill="${gold}"/>`).join('')}<path d="M17 4h67v7H17zM18 88h66v7H18z" fill="${paint}"/>`,
    wardrobe:`<path d="M20 7h60v85H20z" fill="${paint}"/><path d="M25 15h23v65H25zm27 0h23v65H52z" fill="${c.hex}"/><path d="M20 10h60M50 15v65" stroke="${gold}"/><circle cx="44" cy="49" r="2" fill="${gold}"/><circle cx="56" cy="49" r="2" fill="${gold}"/><path d="M16 3h68v7H16zM18 83h64v7H18z" fill="${c.light}"/>`,
    chest:`<path d="M18 15Q50-5 82 15v70H18z" fill="${paint}"/><path d="M18 33h64M24 56h52M24 76h52" stroke="${gold}" stroke-width="3"/><path d="M29 13v71M71 13v71" stroke="${gold}" stroke-width="4"/>${[44,66].map(y=>`<path d="M43 ${y}q7 9 14 0" fill="none" stroke="${gold}" stroke-width="3"/>`).join('')}<path d="M16 83h68v9H16z" fill="${edge}"/>`,
    chair:`<path d="M25 12Q50-6 75 12v57H25z" fill="${paint}"/><path d="M31 17Q50 5 69 17v42H31z" fill="${c.hex}"/>${[28,44].map(y=>`<circle cx="42" cy="${y}" r="2" fill="${c.light}"/><circle cx="58" cy="${y}" r="2" fill="${c.light}"/>`).join('')}<path d="M20 60Q50 52 80 60v19H20z" fill="${c.light}"/><path d="M16 43h10v35H16zM74 43h10v35H74z" fill="${paint}"/><path d="M24 79v15m52-15v15" stroke="${edge}" stroke-width="7"/>`,
    sofa:`<path d="M16 15Q50-4 84 15v54H16z" fill="${paint}"/><path d="M22 20h25v40H22zm31 0h25v40H53z" fill="${c.hex}"/><path d="M15 59Q50 51 85 59v22H15z" fill="${c.light}"/><path d="M10 42h12v39H10zM78 42h12v39H78z" fill="${paint}"/><path d="M19 81v13m62-13v13" stroke="${edge}" stroke-width="7"/>`,
    bed:`<path d="M17 10Q50-6 83 10v71H17z" fill="${paint}"/><path d="M23 19h54v23H23z" fill="${c.light}"/><path d="M20 41h60l9 39H11z" fill="${c.hex}"/><path d="M25 27h20v13H25zm29 0h20v13H54z" fill="#fff0d2"/><path d="M29 44l-7 33m49-33 7 33M14 69h72" stroke="${gold}" stroke-width="3"/><path d="M12 79h76v9H12z" fill="${paint}"/><path d="M17 86v9m66-9v9" stroke="${edge}" stroke-width="6"/>`,
    lamp:`<path d="M50 38v45" stroke="${edge}" stroke-width="8"/><ellipse cx="50" cy="88" rx="25" ry="6" fill="${paint}"/><path d="M31 8h38l17 42Q50 64 14 50z" fill="${paint}"/><path d="M31 8h38M15 49q35 14 70 0" stroke="${gold}" stroke-width="3"/><path d="M40 12 32 48m28-36 8 36" stroke="${c.light}" stroke-width="4"/>`,
    stool:`<path d="M27 34 21 93m52-59 6 59M37 40l-3 53m29-53 3 53" stroke="${edge}" stroke-width="7"/><path d="M23 73h54" stroke="${gold}" stroke-width="4"/><path d="M15 16h70v20Q50 55 15 36z" fill="${paint}"/><ellipse cx="50" cy="17" rx="35" ry="14" fill="${c.light}"/>`,
    table:`<path d="M48 27v58m4-58v58" stroke="${edge}" stroke-width="7"/><path d="M50 70 23 94m27-24 27 24" stroke="${edge}" stroke-width="8"/><ellipse cx="50" cy="22" rx="42" ry="19" fill="${paint}"/><ellipse cx="50" cy="16" rx="42" ry="13" fill="${c.light}"/><path d="M10 22q40 29 80 0" fill="none" stroke="${gold}" stroke-width="2"/>`,
    desk:`<path d="M15 19h70v65H15z" fill="${paint}"/><path d="M39 36h23v57H39z" fill="${edge}"/><path d="M20 34h14v15H20zm0 21h14v15H20zm47-21h12v15H67zm0 21h12v15H67z" fill="${c.hex}"/><path d="M10 6h80v20H10z" fill="${c.light}"/><path d="M18 83v12m64-12v12" stroke="${edge}" stroke-width="7"/>`
  };
  return `<svg class="furniture-art" viewBox="0 0 100 100" role="img" aria-label="${c.name}色の${f.name}、高さ${f.height}" data-color="${f.color}" data-height="${f.height}" data-pixel-height="${h}"><defs><linearGradient id="wood-${uid}" x2="1" y2="1"><stop stop-color="${c.light}"/><stop offset=".48" stop-color="${c.hex}"/><stop offset="1" stop-color="${c.dark}"/></linearGradient></defs><ellipse cx="50" cy="94" rx="42" ry="4" fill="#20151a66"/><g class="furniture-shape" transform="translate(0 ${top}) scale(1 ${h/100})" stroke="${edge}" stroke-width="1.6" stroke-linejoin="round">${shapes[f.kind]||shapes.wardrobe}</g><path d="M4 ${top}v${h}m-2 0h5M2 ${top}h5" stroke="${gold}" stroke-width="1.5" opacity=".8"/></svg>`;
}
function roomArt(room){
  const c=col(room.wall);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480"><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="${c.dark}"/><stop offset="1" stop-color="${c.hex}"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#9e7650"/><stop offset="1" stop-color="#473338"/></linearGradient><radialGradient id="light"><stop stop-color="#ffe5a6" stop-opacity=".55"/><stop offset="1" stop-color="#ffe5a6" stop-opacity="0"/></radialGradient></defs><path fill="url(#wall)" d="M0 0h400v480H0z"/><path d="M18 0v480M382 0v480" stroke="#e5bb70" stroke-width="7"/><path d="M0 270h400v210H0z" fill="url(#floor)"/><path d="M0 270h400M0 370h400M50 270 0 480M150 270 130 480M250 270 270 480M350 270 400 480" stroke="#e2ae6244" stroke-width="3"/><path d="M141 112V52Q200-20 259 52v60z" fill="#16253e" stroke="#e5bd79" stroke-width="5"/><path d="M150 107V55Q200-5 250 55v52z" fill="#d5c59c"/><path d="M200 9v101M145 63h110M164 32l71 71M236 32l-71 71" stroke="#735a44" stroke-width="4"/><ellipse cx="200" cy="104" rx="160" ry="125" fill="url(#light)"/><path d="M32 114h336M32 292h336" stroke="#e9c27b" stroke-opacity=".5" stroke-width="2"/><path d="M200 128v134m0 44v146" stroke="#e9c27b33"/><path d="M32 451h336" stroke="#e9c27b55" stroke-width="3"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
</script><script>'use strict';
const col=k=>Kotori.COLORS.find(c=>c.key===k),app=document.querySelector('#app'),dialog=document.querySelector('#dialog');
let game=null,mode='solo',busy=false;let progress={solo:0,coop:0},scores={solo:[],coop:[]};
try{const saved=JSON.parse(localStorage.getItem('kotori-five-v1'));if(saved){progress=saved.progress;scores=saved.scores;}}catch{}
function save(){try{localStorage.setItem('kotori-five-v1',JSON.stringify({progress,scores}));}catch{}}
function pixel(actor){const rows=['......HHHH......','.....HHHHHH.....','....HHHHHHHH....','...HHHHHHHHHH...','..HHHHHHHHHHHH..','.....FFFFF.....','....FDFDF......','.....FFFF......','....CCCCCC.....','...CCCCCCCC....','..FCCCCCCCCF...','..FCCCCCCCCF...','....CCCCCC.....','....CCCCCC.....','....BB.BB......','...BBB.BBB.....'];const pal={H:actor?'#d5a159':'#9b86cf',F:'#f3c9a0',D:'#283540',C:actor?'#73b1ad':'#9b86cf',B:'#343647'};return `<svg class="pixel" viewBox="0 0 16 17" shape-rendering="crispEdges" aria-hidden="true">${rows.flatMap((r,y)=>[...r].map((v,x)=>pal[v]?`<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[v]}"/>`:'')).join('')}</svg>`;}
function modal(html){dialog.innerHTML=html;if(!dialog.open)dialog.showModal();}
function close(){dialog.close();}
function home(){game=null;busy=false;app.innerHTML=`<section class="hero"><div class="eyebrow">A LITTLE BIRD, A BIG ADVENTURE</div><h1>逃げた小鳥を追っていたら、<br>なんか世界救うことに<br>なってました。</h1><p>色、羽、鳴き声を手がかりに。<br>魔法使いと弟子の、五つの小さな追いかけっこ。</p></section><div class="modes"><button data-mode="solo" aria-pressed="${mode==='solo'}">1人でふたりを操作</button><button data-mode="coop" aria-pressed="${mode==='coop'}">2人で協力・1人1コマ</button></div><p class="note">2人用は同じ端末で交代します。部屋と家具の色はふたりとも見えます。</p><section class="journey">${Kotori.STAGES.map((s,i)=>`<button class="stage" data-stage="${i}"><span class="number">0${i+1}</span><b>${s.name}</b><small>${s.subtitle}</small><small>${scores[mode]?.[i]?'最高 '+scores[mode][i]+' 点':i<=progress[mode]?'冒険をはじめる':'試遊：この面からも遊べます'}</small></button>`).join('')}</section><p class="note">順番に遊ぶとルールと物語が少しずつ広がります。試遊版では、どのステージも選べます。</p>`;app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;home();});app.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>start(+b.dataset.stage));}
function start(i){close();game=Kotori.createGame(i,mode);busy=false;render();modal(`<div class="eyebrow">STAGE ${i+1} / 5</div><h2>${game.cfg.name}</h2><div class="speech">${pixel(0)}<p>${game.cfg.intro}</p></div><p>${game.cfg.lesson}</p><p>魔法：範囲 ${game.cfg.area} 回 / 追跡 ${game.cfg.trace} 回。制限 ${game.cfg.turns} ターン。</p><button class="primary" id="begin">冒険をはじめる</button>`);dialog.querySelector('#begin').onclick=()=>{close();banner();};}
function banner(){const b=document.querySelector('#turnBanner');b.classList.remove('show');void b.offsetWidth;b.textContent='TURN '+game.state.turn;b.classList.add('show');}
function render(){if(!game)return;const s=game.state,c=game.cfg;const speech=s.phase==='move'?(s.actor?'僕の番だね！':'わたしの番ね！')+' 道でつながった部屋へ移動しよう。同じ部屋にいてもいいよ。':s.phase==='search'?'この部屋の家具をひとつ選んで調べよう。魔法で手がかりを探すこともできるよ。':s.phase==='bird'?'ふたりの探索が終わったね。小鳥が動くよ。':'今回の冒険を振り返ろう。';
app.innerHTML=`<div class="hud"><div><span>STAGE ${s.stageIndex+1} / 5</span><h2>${c.name}</h2></div><span>TURN <b>${s.turn}</b> / ${c.turns} · ${mode==='solo'?'1人用':'2人協力'}</span><button id="retry">やり直す</button></div><div class="layout"><section><div class="speech">${pixel(s.actor)}<div><b>${Kotori.person(s.actor)}</b><p>${speech}</p></div></div><section class="discovery" aria-live="polite"><small>最新の発見 · TURN ${s.latest.turn} / ${Kotori.person(s.latest.actor)}</small><h2>${s.latest.icon} ${s.latest.title}</h2><p>${s.latest.body}</p></section><div class="board">${s.rooms.map((r,i)=>{const can=s.phase==='move'&&(i===s.positions[s.actor]||game.neighbors(s.positions[s.actor]).includes(i));const edges=game.edges();return `<section class="room ${edges.some(e=>e.includes(i)&&e.includes(i+1))&&i%3<2?'door-right':''} ${edges.some(e=>e.includes(i)&&e.includes(i+3))?'door-down':''} ${s.area?.includes(i)?'hint':''} ${s.reveal?.room===i?'singing':''}" style="--wall:${col(r.wall).dark}" aria-label="${Kotori.names[i]}、${col(r.wall).name}の部屋"><div class="room-name"><span>${Kotori.names[i]}${s.reveal?.room===i?' ♪':''}</span><button class="room-move" data-move="${i}" ${!can?'disabled':''}>${i===s.positions[s.actor]?'待機':'移動'}</button></div><div class="furnitures">${r.furniture.map((f,j)=>`<button class="furniture" data-item="${j}" data-room="${i}" title="${col(f.color).name}の${f.name}・高さ${f.height}" aria-label="${Kotori.names[i]}の${col(f.color).name}の${f.name}、高さ${f.height}を探索" ${s.phase!=='search'||i!==s.positions[s.actor]?'disabled':''}>${furnitureSVG(f,`${i}-${j}`)}${r.feathers.filter(m=>m.item===j).map(m=>`<span class="feather" style="color:${col(m.color).light}" title="${m.foundTurn}ターンに発見した過去の痕跡">❧</span>`).join('')}</button>`).join('')}</div></section>`;}).join('')}<div class="pawns">${[0,1].map(a=>`<div class="pawn" data-pawn="${a}" data-name="${Kotori.person(a)}">${pixel(a)}</div>`).join('')}</div></div><div class="event" aria-live="polite">${s.event||'小鳥は二人の探索後に動きます。道のつながりと、ふたりの位置に注目！'}</div></section><aside class="sidebar"><section class="panel"><h3>魔法の手がかり</h3><button data-spell="area" ${s.phase!=='search'||!s.magic.area?'disabled':''}>✧ 範囲魔法　残り ${s.magic.area}</button><button data-spell="trace" ${s.phase!=='search'||!s.magic.trace||!s.bird.prev?'disabled':''}>↗ 追跡魔法　残り ${s.magic.trace}</button><p>魔法は家具の探索の代わりに使います。回数はふたりで共有します。</p><h3>探索ゲージ</h3><div class="gauge">${[1,2,3,4].map(i=>`<i class="${s.gauge>=i?'on':''}"></i>`).join('')}</div><button id="calm" ${s.phase!=='search'||s.gauge<4||s.frozen?'disabled':''}>♬ 静穏の鈴 ${s.frozen?'発動中':''}</button><p>満タンで次の小鳥の移動を1回止めます。家具の探索も続けられます。</p></section><section class="panel"><h3>ふたりの推理メモ</h3><p>気になる候補はいくつでも選べます。</p>${['favorite',...(c.height?['height']:[]),...(c.dislikes?['dislike']:[])].map(k=>`<label>${{favorite:'好きな家具の色',height:'好きな高さ',dislike:'苦手な2色（部屋・家具共通）'}[k]}</label><div class="memo-row">${(k==='height'?[1,2,3,4]:Kotori.COLORS.map(c=>c.key)).map(v=>`<button data-memo="${k}" data-value="${v}" aria-pressed="${s.memo[k].includes(v)}">${k==='height'?v:col(v).name}</button>`).join('')}</div>`).join('')}</section><section class="panel"><h3>この舞台のルール</h3><p>${c.lesson}</p><p>${c.feature==='song'?'3ターンごとに歌で居場所がわかります。':c.feature==='bloom'?'3ターンごとに花の魔力でゲージが1つ増えます。':''}</p><details><summary>発見の記録</summary><div class="history">${s.history.map(h=>`<p>T${h.turn} · ${h.msg}</p>`).join('')}</div></details></section></aside></div>`;
positionPawns();app.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>act(()=>game.move(+b.dataset.move)));app.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>act(()=>game.investigate(+b.dataset.item)));app.querySelectorAll('[data-spell]').forEach(b=>b.onclick=()=>act(()=>game.spell(b.dataset.spell)));app.querySelector('#calm').onclick=()=>act(()=>game.calm());app.querySelectorAll('[data-memo]').forEach(b=>b.onclick=()=>{const k=b.dataset.memo,v=k==='height'?+b.dataset.value:b.dataset.value;const a=s.memo[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);b.setAttribute('aria-pressed',a.includes(v));});app.querySelector('#retry').onclick=()=>modal('<h2>この舞台をやり直す？</h2><p>家具の色と高さ、小鳥の好みが新しく決まります。</p><button id="yes" class="primary">やり直す</button><button id="no">戻る</button>');app.querySelector('#retry').addEventListener('click',()=>{dialog.querySelector('#yes').onclick=()=>start(s.stageIndex);dialog.querySelector('#no').onclick=close;});}
function positionPawns(){if(!game)return;const rooms=app.querySelectorAll('.room');app.querySelectorAll('[data-pawn]').forEach(p=>{const a=+p.dataset.pawn,r=rooms[game.state.positions[a]];p.style.left=(r.offsetLeft+r.offsetWidth*(a?.6:.22))+'px';p.style.top=(r.offsetTop+r.offsetHeight-p.offsetHeight-12)+'px';});}
window.addEventListener('resize',positionPawns);
async function act(fn){if(busy||!game)return;const old=game.state.actor,phase=game.state.phase,oldPos=[...game.state.positions];if(!fn())return;busy=true;if(phase==='move'){const pawn=app.querySelector(`[data-pawn="${old}"]`);positionPawns();if(oldPos[old]!==game.state.positions[old])pawn.classList.add('walking');await new Promise(r=>setTimeout(r,550));}render();if(game.state.result){result();busy=false;return;}if(game.state.phase==='bird'){await new Promise(r=>setTimeout(r,650));game.advance();render();if(game.state.result)result();else{banner();handoff();}}else if(old!==game.state.actor)handoff();busy=false;}
function handoff(){if(mode!=='coop'||game.state.result)return;modal(`<h2>${Kotori.person(game.state.actor)}の番です</h2><div class="speech">${pixel(game.state.actor)}<p>見つけたことを相談して、担当の人に操作を交代してください。</p></div><button id="handoff" class="primary">交代した・続ける</button>`);dialog.querySelector('#handoff').onclick=close;}
function result(){const s=game.state,win=s.result==='won';if(win){progress[mode]=Math.max(progress[mode],s.stageIndex+1);scores[mode][s.stageIndex]=Math.max(scores[mode][s.stageIndex]||0,s.score);save();}modal(`<div class="result"><div class="eyebrow">${win?'STAGE CLEAR':'TRY AGAIN'}</div><h2>${win?'小鳥に追いついた！':'もう一度、手がかりをつなごう'}</h2>${win?`<span class="rank">${s.rank}</span><b>${s.score} 点</b><p>${game.cfg.ending}</p>`:'<p>最後の隠れ場所が盤面に光っています。移動を止める鈴や、追跡魔法も使ってみましょう。</p>'}<button id="resultRetry">この面をもう一度</button>${win&&s.stageIndex<4?'<button id="next" class="primary">次の舞台へ</button>':''}<button id="journey">旅の一覧へ</button><button id="inspect">盤面を見る</button></div>`);dialog.querySelector('#resultRetry').onclick=()=>start(s.stageIndex);dialog.querySelector('#journey').onclick=()=>{close();home();};dialog.querySelector('#inspect').onclick=close;if(dialog.querySelector('#next'))dialog.querySelector('#next').onclick=()=>start(s.stageIndex+1);}
document.querySelector('#home').onclick=e=>{e.preventDefault();if(busy)return;if(game&&!game.state.result){modal('<h2>旅の一覧へ戻る？</h2><p>このステージの途中経過は保存されません。</p><button id="leave">一覧へ戻る</button><button id="stay">続ける</button>');dialog.querySelector('#leave').onclick=()=>{close();home();};dialog.querySelector('#stay').onclick=close;}else home();};
document.querySelector('#rulesButton').onclick=()=>{modal(`<h2>ふたりで小鳥を探そう</h2><div class="rule-flow"><span>🧙 魔法使い 移動 → 探索</span><b>→</b><span>🧑 弟子 移動 → 探索</span><b>→</b><span>♪ 小鳥が移動</span></div><p>小鳥が隠れている家具を調べればクリア！ 道でつながった隣室へ1部屋移動するか、その場に待機してから家具を選びます。</p><ul><li>部屋と家具の色・高さはふたりとも見えます。家具は各部屋に赤青黄緑が1個ずつ、高さ1〜4が重複なし。毎回ランダムに決まります。</li><li>1面は好きな色、2面からは好きな色または高さを選んで隠れます。3面からは苦手な2色の部屋と家具を必ず避けます。</li><li>小鳥は二人の探索後に移動。同室・隣室に近づくと逃げます。近い人までの道の距離が最大になる隣室を優先。次に二人との距離の合計、同じなら左上→上中央→右上→左下→下中央→右下の順です。安全な道がなければ待機します。</li><li>前のターンの家具を調べると色付き羽が残ります。羽の色は好きな家具の色。弟子は鳴き声と、前の部屋の白い羽もわかります。色付き羽は発見後も過去の記録として残ります。</li><li>魔法の残り回数はふたりで共有。失敗した家具探索でゲージが貯まり、満タンの鈴で次の小鳥の移動を止められます。</li><li>得点＝1000＋残りターン×100＋未使用の魔法×80。早く、魔法を節約して見つけるほど高得点。</li></ul><p>2人用は同じ端末で一人一つのコマを担当。1人用は両方を操作します。推理メモは複数選択できます。</p><button id="closeRules" class="primary">わかった</button>`);dialog.querySelector('#closeRules').onclick=close;};
home();
</script></body></html>
